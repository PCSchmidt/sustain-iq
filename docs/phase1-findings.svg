<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d">
<title id="t">Bearing-fault classification: how the score depends on how you test, and what a slower sensor costs</title>
<desc id="d">Left: a four-class bearing-fault classifier scores 99.9 percent on a leaky random split, 98.7 percent on an unseen motor load, 51.9 percent on an unseen fault size and 43.5 percent on locked recordings. Right: as the accelerometer sample rate falls from 12,000 to 750 hertz, fault detection by the classifier stays at 100 percent, four-class diagnosis falls from 98.7 to about 86 to 92 percent, and detection by a single vibration-level threshold collapses.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{fill:var(--surface)} .h1{font-size:16px;font-weight:600;fill:var(--ink)} .h2{font-size:12px;fill:var(--ink2)}
.panel{font-size:13px;font-weight:600;fill:var(--ink)} .tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.axis-title{font-size:12px;fill:var(--ink2)} .lab{font-size:12px;fill:var(--ink2)} .val{font-size:12px;font-weight:600;fill:var(--ink)} .note{font-size:11px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .base{stroke:var(--axis);stroke-width:1}
.b{fill:var(--s1)} .l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .l3{stroke:var(--s3)}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .ring{stroke:var(--surface);stroke-width:2}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
</style>
<rect class="bg" width="940" height="480"/>
<text class="h1" x="24" y="30">Bearing-fault classification on the CWRU data: it depends on how you test it</text>
<text class="h2" x="24" y="50">Balanced accuracy of a 32-32-16-4 MLP on 32 log band-energy features (1,024-sample windows). Chance is 25% for four classes.</text>
<text class="panel" x="24" y="100">Four-class diagnosis, scored four ways</text>
<line class="base" x1="262.0" x2="262.0" y1="117" y2="355"/>
<text class="tick" x="262.0" y="371" text-anchor="middle">0%</text>
<line class="grid" x1="347.0" x2="347.0" y1="117" y2="355"/>
<text class="tick" x="347.0" y="371" text-anchor="middle">50%</text>
<line class="grid" x1="432.0" x2="432.0" y1="117" y2="355"/>
<text class="tick" x="432.0" y="371" text-anchor="middle">100%</text>
<text class="lab" x="250" y="137" text-anchor="end">Random windows</text>
<text class="note" x="250" y="153" text-anchor="end">(leaky)</text>
<path class="b" d="M262,129 h165.9 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-165.9 z"><title>Random windows (leaky): 99.9%</title></path>
<text class="val" x="439.9" y="145">99.9%</text>
<text class="lab" x="250" y="207" text-anchor="end">Unseen motor load</text>
<path class="b" d="M262,191 h163.8 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-163.8 z"><title>Unseen motor load : 98.7%</title></path>
<text class="val" x="437.8" y="207">98.7%</text>
<text class="lab" x="250" y="269" text-anchor="end">Unseen fault size</text>
<path class="b" d="M262,253 h84.3 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-84.3 z"><title>Unseen fault size : 51.9%</title></path>
<text class="val" x="358.3" y="269">51.9%</text>
<text class="lab" x="250" y="323" text-anchor="end">Locked recordings</text>
<text class="note" x="250" y="339" text-anchor="end">(new sizes, positions)</text>
<path class="b" d="M262,315 h69.9 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-69.9 z"><title>Locked recordings (new sizes, positions): 43.5%</title></path>
<text class="val" x="343.9" y="331">43.5%</text>
<text class="panel" x="520" y="100">What a slower accelerometer costs</text>
<circle class="f1 ring" cx="526.0" cy="120.0" r="5"></circle>
<text class="lab" x="536" y="124">Detection (MLP)</text>
<rect class="f2 ring" x="633.0" y="115.0" width="10" height="10" rx="1.5"></rect>
<text class="lab" x="648" y="124">Diagnosis (MLP)</text>
<polygon class="f3 ring" points="750.0,113.5 756.5,120.0 750.0,126.5 743.5,120.0" stroke-linejoin="round"></polygon>
<text class="lab" x="760" y="124">Detection (RMS only)</text>
<line class="base" x1="560" x2="760" y1="360.0" y2="360.0"/>
<text class="tick" x="552" y="364.0" text-anchor="end">0%</text>
<line class="grid" x1="560" x2="760" y1="307.5" y2="307.5"/>
<text class="tick" x="552" y="311.5" text-anchor="end">25%</text>
<line class="grid" x1="560" x2="760" y1="255.0" y2="255.0"/>
<text class="tick" x="552" y="259.0" text-anchor="end">50%</text>
<line class="grid" x1="560" x2="760" y1="202.5" y2="202.5"/>
<text class="tick" x="552" y="206.5" text-anchor="end">75%</text>
<line class="grid" x1="560" x2="760" y1="150.0" y2="150.0"/>
<text class="tick" x="552" y="154.0" text-anchor="end">100%</text>
<text class="tick" x="574.0" y="378" text-anchor="middle">12k</text>
<text class="tick" x="617.0" y="378" text-anchor="middle">6k</text>
<text class="tick" x="660.0" y="378" text-anchor="middle">3k</text>
<text class="tick" x="703.0" y="378" text-anchor="middle">1.5k</text>
<text class="tick" x="746.0" y="378" text-anchor="middle">750</text>
<text class="axis-title" x="660" y="400" text-anchor="middle">Accelerometer sample rate (Hz), slower to the right</text>
<polyline class="line l1" points="574.0,150.0 617.0,150.0 660.0,150.0 703.0,150.1 746.0,150.1"/>
<circle class="f1 ring" cx="574.0" cy="150.0" r="5"><title>Detection, MLP: 100.0% at 12000 Hz</title></circle>
<circle class="f1 ring" cx="617.0" cy="150.0" r="5"><title>Detection, MLP: 100.0% at 6000 Hz</title></circle>
<circle class="f1 ring" cx="660.0" cy="150.0" r="5"><title>Detection, MLP: 100.0% at 3000 Hz</title></circle>
<circle class="f1 ring" cx="703.0" cy="150.1" r="5"><title>Detection, MLP: 100.0% at 1500 Hz</title></circle>
<circle class="f1 ring" cx="746.0" cy="150.1" r="5"><title>Detection, MLP: 100.0% at 750 Hz</title></circle>
<polyline class="line l2" points="574.0,152.7 617.0,155.6 660.0,164.0 703.0,179.7 746.0,167.4"/>
<rect class="f2 ring" x="569.0" y="147.7" width="10" height="10" rx="1.5"><title>Diagnosis, MLP: 98.7% at 12000 Hz</title></rect>
<rect class="f2 ring" x="612.0" y="150.6" width="10" height="10" rx="1.5"><title>Diagnosis, MLP: 97.3% at 6000 Hz</title></rect>
<rect class="f2 ring" x="655.0" y="159.0" width="10" height="10" rx="1.5"><title>Diagnosis, MLP: 93.3% at 3000 Hz</title></rect>
<rect class="f2 ring" x="698.0" y="174.7" width="10" height="10" rx="1.5"><title>Diagnosis, MLP: 85.9% at 1500 Hz</title></rect>
<rect class="f2 ring" x="741.0" y="162.4" width="10" height="10" rx="1.5"><title>Diagnosis, MLP: 91.7% at 750 Hz</title></rect>
<polyline class="line l3" points="574.0,150.9 617.0,211.0 660.0,244.6 703.0,218.3 746.0,279.9"/>
<polygon class="f3 ring" points="574.0,144.4 580.5,150.9 574.0,157.4 567.5,150.9" stroke-linejoin="round"><title>Detection, RMS threshold only: 99.6% at 12000 Hz</title></polygon>
<polygon class="f3 ring" points="617.0,204.5 623.5,211.0 617.0,217.5 610.5,211.0" stroke-linejoin="round"><title>Detection, RMS threshold only: 70.9% at 6000 Hz</title></polygon>
<polygon class="f3 ring" points="660.0,238.1 666.5,244.6 660.0,251.1 653.5,244.6" stroke-linejoin="round"><title>Detection, RMS threshold only: 54.9% at 3000 Hz</title></polygon>
<polygon class="f3 ring" points="703.0,211.8 709.5,218.3 703.0,224.8 696.5,218.3" stroke-linejoin="round"><title>Detection, RMS threshold only: 67.5% at 1500 Hz</title></polygon>
<polygon class="f3 ring" points="746.0,273.4 752.5,279.9 746.0,286.4 739.5,279.9" stroke-linejoin="round"><title>Detection, RMS threshold only: 38.1% at 750 Hz</title></polygon>
<text class="lab" x="774" y="154.1">Detection, MLP</text>
<text class="lab" x="774" y="171.4">Diagnosis, MLP</text>
<text class="lab" x="774" y="283.9">Detection, RMS threshold only</text>
<text class="note" x="24" y="446">Left: random split 3 seeds; unseen load 4 folds; unseen size 3 folds; locked set evaluated after all choices (3 training seeds). Right: leave-one-load-out, 3 training seeds.</text>
<text class="note" x="24" y="460">The locked set is 24 recordings never used for training or choices (0.028 in. faults; outer race at 3:00 and 12:00). Lab data with large seeded faults.</text>
<text class="note" x="24" y="474">Data: Case Western Reserve University Bearing Data Center. Values: docs/results.md.</text>
</svg>
