[package]
name = "tinyfeat"
version = "0.1.0"
edition = "2021"
description = "no_std log band-energy features for vibration windows (Hann, 1024-point FFT, 32 log-spaced bands), checked against the sustain_iq Python features"
license = "MIT"

[dependencies]
libm = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyinfer = { path = "../tinyinfer" }
